server.port=0

# 单测/本地运行日志：打印请求标识、版本决策、幂等状态与权限判定依据
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.github.h3yow.versionedapiidempotencygatewayjava=INFO
logging.level.org.springframework=WARN

# 幂等记录有界保留：存活时间（秒，0=不按时间过期）、容量上限（0=不限）、清理周期（毫秒）
gateway.idempotency.ttl-seconds=3600
gateway.idempotency.max-entries=10000
gateway.idempotency.cleanup-interval-ms=60000
