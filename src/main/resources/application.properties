server.port=0

# 单测/本地运行日志：打印请求标识、版本决策、幂等状态与权限判定依据
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.github.h3yow.versionedapiidempotencygatewayjava=INFO
logging.level.org.springframework=WARN

# 幂等记录有界保留：终态记录存活时间（ms，<=0 关闭 TTL）；容量上限（条，<=0 不限）；定时清理间隔（ms）
gateway.idempotency.ttl-ms=3600000
gateway.idempotency.max-records=10000
gateway.idempotency.cleanup-interval-ms=60000
